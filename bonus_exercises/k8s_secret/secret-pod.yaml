apiVersion: v1
kind: Pod 
metadata: 
  name: secret-test-pod 
spec:
  containers:
    - name: test-container
      image: busybox
      command: ["sleep", "3600"]
      env:
      - name: SECRET_USERNAME
        valueFrom:
          secretKeyRef:
            name: user-pass2
            key: username
      - name: SECRET_PASSWORD
        valueFrom:
          secretKeyRef:
            name: user-pass2
            key: password 